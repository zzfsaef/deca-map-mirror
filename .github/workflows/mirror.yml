name: mirror-deca-map

# 在 GitHub 的服务器上抓取 mathartbang 的 theHunter:COTW 地图站。
#
# 站点结构（从 map.html 里分析出来的）：
#   /deca/hp/index.html, map.html, tool/save.html
#   /deca/hp/data/<保护区>/{reserve,pois,layers}.json
#   保护区列表写死在 map.html 里：
#     r0 r1 r2 r3 r4 r6 r8 r9 r10 r11 r12 r13 r14 r16 r17 r18 r19 r20 r21
# 一共 3 + 19*3 = 60 个文件，没有图片或瓦片。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      args:
        description: '额外传给 mirror_site.py 的参数'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 连通性自检
        run: |
          curl -sS -o /dev/null -w "map.html -> status=%{http_code}\n" \
            --max-time 30 https://www.mathartbang.com/deca/hp/map.html || true
          curl -sS -o /dev/null -w "data/r0  -> status=%{http_code}\n" \
            --max-time 30 https://www.mathartbang.com/deca/hp/data/r0/reserve.json || true

      - name: 开始镜像
        id: mirror
        continue-on-error: true
        run: |
          set +e
          BASE="https://www.mathartbang.com"
          SEEDS="$BASE/deca/hp/index.html $BASE/deca/hp/map.html $BASE/deca/hp/tool/save.html"
          for r in r0 r1 r2 r3 r4 r6 r8 r9 r10 r11 r12 r13 r14 r16 r17 r18 r19 r20 r21; do
            for f in reserve pois layers; do
              SEEDS="$SEEDS $BASE/deca/hp/data/$r/$f.json"
            done
          done
          echo "种子 URL 数量: $(echo $SEEDS | wc -w)"
          python -u mirror_site.py \
            --out site \
            --prefix /deca/hp/ \
            --seeds $SEEDS \
            --report report.json ${{ github.event.inputs.args }} 2>&1 | tee mirror.log
          echo "mirror_exit=${PIPESTATUS[0]}" | tee -a mirror.log

      - name: 汇总与诊断
        if: always()
        run: |
          {
            echo "### 镜像脚本输出（尾部 150 行）"
            echo '```'
            tail -150 mirror.log 2>/dev/null || echo "(没有 mirror.log)"
            echo
            echo '```'
            echo "### 抓取结果"
            echo '```'
            du -sh site 2>/dev/null || echo "(没有 site 目录)"
            echo "文件数: $(find site -type f 2>/dev/null | wc -l)"
            echo '```'
            echo "### 每个文件的大小"
            echo '```'
            find site -type f -printf '%10s  %p\n' 2>/dev/null | sort -k2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 保留报告与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            report.json
            mirror.log
          if-no-files-found: ignore
          retention-days: 30

      # 体积大时 artifact 会超限，所以主通道走 Release 资产（单文件上限 2 GB）
      - name: 打包
        id: pack
        if: hashFiles('site/**') != ''
        run: |
          zip -qr site.zip site
          ls -lh site.zip
          echo "size=$(du -h site.zip | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: 发布到 Release
        if: steps.pack.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mirror-${{ github.run_number }}"
          gh release create "$TAG" site.zip \
            --title "deca map mirror #${{ github.run_number }}" \
            --notes "theHunter:COTW 地图站的静态镜像（${{ steps.pack.outputs.size }}）。解压后用 python -m http.server 8000 --directory site 起服务，打开 http://localhost:8000/deca/hp/map.html"
