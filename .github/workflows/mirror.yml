name: mirror-deca-map

# 在 GitHub 的服务器上抓取 mathartbang 的地图站，再把结果发布成可下载的文件。
# 触发方式：push 到 main，或者在 Actions 页面手动点 "Run workflow"。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prefix:
        description: '只抓该路径前缀'
        required: false
        default: '/deca/hp/'
      args:
        description: '额外传给 mirror_site.py 的参数（例如 --dry-run）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 环境自检
        run: |
          echo "python  : $(python -V 2>&1)"
          echo "locale  : $(locale 2>&1 | head -3 | tr '\n' ' ')"
          echo "仓库文件: $(ls -1 | tr '\n' ' ')"

      - name: 连通性自检
        run: |
          echo "=== HTTP 状态 ==="
          curl -sS -o /dev/null -w "status=%{http_code} redirect=%{redirect_url}\n" \
            --max-time 30 https://www.mathartbang.com/deca/hp/map.html || true
          echo "=== 响应头 ==="
          curl -sSI --max-time 30 https://www.mathartbang.com/deca/hp/map.html | head -20 || true
          echo "=== 正文前 300 字节 ==="
          curl -sS --max-time 30 https://www.mathartbang.com/deca/hp/map.html | head -c 300 || true
          echo

      # continue-on-error：脚本只要有 URL 抓不到就会返回退出码 2，
      # 那不该让整条流水线挂掉、把已经下好的文件全丢掉。
      - name: 开始镜像
        id: mirror
        continue-on-error: true
        run: |
          set +e
          python -u mirror_site.py \
            --out site \
            --prefix "${{ github.event.inputs.prefix || '/deca/hp/' }}" \
            --report report.json 2>&1 | tee mirror.log
          echo "mirror_exit=${PIPESTATUS[0]}" | tee -a mirror.log

      - name: 汇总与诊断
        if: always()
        run: |
          {
            echo "### 镜像脚本输出（尾部 120 行）"
            echo '```'
            tail -120 mirror.log 2>/dev/null || echo "(没有 mirror.log)"
            echo
            echo '```'
            echo "### 抓取结果"
            echo '```'
            du -sh site 2>/dev/null || echo "(没有 site 目录)"
            echo "文件数: $(find site -type f 2>/dev/null | wc -l)"
            echo '```'
            echo "### 最大的 20 个文件"
            echo '```'
            find site -type f -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 保留报告与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            report.json
            mirror.log
          if-no-files-found: ignore
          retention-days: 30

      # 体积大时 artifact 会超限，所以主通道走 Release 资产（单文件上限 2 GB）
      - name: 打包
        id: pack
        if: hashFiles('site/**') != ''
        run: |
          zip -qr site.zip site
          ls -lh site.zip
          echo "size=$(du -h site.zip | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: 发布到 Release
        if: steps.pack.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mirror-${{ github.run_number }}"
          gh release create "$TAG" site.zip \
            --title "deca map mirror #${{ github.run_number }}" \
            --notes "自动抓取的静态镜像（${{ steps.pack.outputs.size }}）。下载 site.zip 解压后，用 python -m http.server 8000 --directory site 起服务。"
