name: mirror-deca-map

# 分两遍抓 mathartbang 地图站，然后汉化，最后打包发布。
#
#   第一遍：3 个页面 + 19×3 个 JSON + /deca/lib/（从页面里自动发现）
#   第二遍：指定保护区的底图瓦片 + 动物热力图（清单由 gen_urls.py 从 layers.json 生成）
#   最后  ：localize.py 把界面文字换成中文（只改显示文字，不动 id / url 等程序字段）

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reserves:
        description: '要下图片的保护区，空格分隔（r6=育空河谷）'
        required: false
        default: 'r6'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成第一遍清单
        run: |
          BASE=https://www.mathartbang.com
          : > bootstrap.txt
          for f in index.html map.html tool/save.html; do
            echo "$BASE/deca/hp/$f" >> bootstrap.txt
          done
          for r in r0 r1 r2 r3 r4 r6 r8 r9 r10 r11 r12 r13 r14 r16 r17 r18 r19 r20 r21; do
            for f in reserve pois layers; do
              echo "$BASE/deca/hp/data/$r/$f.json" >> bootstrap.txt
            done
          done
          echo "第一遍 URL 数: $(wc -l < bootstrap.txt)"
          python -u -c "import sys; print('python', sys.version)"

      # --skip-prefix：不从页面里跟 data/ 下的链接（图片留给第二遍按清单抓），
      # 但 /deca/lib/ 会被自动发现并抓下来。注意 skip 只作用于「发现的链接」，
      # 不影响上面明确列出的起始 URL。
      - name: 第一遍 — 框架 + lib/
        continue-on-error: true
        run: |
          python -u mirror_site.py --out site --prefix /deca/ \
            --skip-prefix /deca/hp/data/ \
            --seeds-file bootstrap.txt --jobs 8 \
            --report report1.json 2>&1 | tee pass1.log

      - name: 生成第二遍清单
        run: |
          RESERVES="${{ github.event.inputs.reserves }}"
          [ -z "$RESERVES" ] && RESERVES="r6"
          echo "目标保护区: $RESERVES"
          python gen_urls.py --site site --reserves $RESERVES > assets.txt
          echo "第二遍 URL 数: $(wc -l < assets.txt)"

      - name: 第二遍 — 底图 + 热力图
        continue-on-error: true
        run: |
          python -u mirror_site.py --out site --prefix /deca/ \
            --seeds-file assets.txt --jobs 8 \
            --report report2.json 2>&1 | tee pass2.log

      - name: 汉化
        run: python localize.py --site site

      - name: 汇总
        if: always()
        run: |
          {
            echo "### 结果"
            echo '```'
            echo "文件总数: $(find site -type f 2>/dev/null | wc -l)"
            du -sh site 2>/dev/null || echo "(没有 site 目录)"
            echo '```'
            echo "### 第二遍日志尾部"
            echo '```'
            tail -45 pass2.log 2>/dev/null || echo "(没有 pass2.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 打包
        id: pack
        if: hashFiles('site/**') != ''
        run: |
          zip -qr site.zip site
          ls -lh site.zip
          echo "size=$(du -h site.zip | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: 发布到 Release
        if: steps.pack.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mirror-${{ github.run_number }}"
          gh release create "$TAG" site.zip \
            --title "deca map mirror #${{ github.run_number }}" \
            --notes "中文界面版。解压后：python -m http.server 8000 --directory site，然后打开 http://localhost:8000/deca/hp/map.html"
